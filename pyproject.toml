[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gin"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gin*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring Postgres and optional embedding model",
]
