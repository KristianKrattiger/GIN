# Synthetic news-wire eval corpus for GIN tiered storage PoC.
# Shared wire copy, controlled divergence, counterfactual probes, out-of-scope stubs.

documents:
  - id: incident_centralwire
    outlet: CentralWire
    title: Downtown incident response
    eval_layer: realism
    eval_tag: incident_divergence
    chunks:
      - |
        RIVERPORT — Officials responded to a downtown incident Tuesday evening.
        Emergency services confirmed 142 people received treatment at area hospitals.
        Police said 23 arrests were made before midnight.
        The mayor scheduled a briefing for Wednesday morning.

  - id: incident_metrodaily
    outlet: MetroDaily
    title: Downtown incident response
    eval_layer: realism
    eval_tag: incident_divergence
    chunks:
      - |
        RIVERPORT — Officials responded to a downtown incident Tuesday evening.
        Emergency services confirmed 98 people received treatment at area hospitals.
        Police said 11 arrests were made before midnight.
        City council members demanded an independent review.

