# chunk-level edges (first chunk of each doc unless noted)
edges:
  - src: incident_centralwire:0
    dst: incident_metrodaily:0
    type: contradicts
    note: hospital treatment count and arrest count diverge after shared lede

  - src: incident_centralwire:0
    dst: incident_regionalpost:0
    type: contradicts
    note: arrest count diverges after shared treatment count

  - src: election_centralwire:0
    dst: election_metrodaily:0
    type: contradicts
    note: turnout percentage diverges after shared margin
